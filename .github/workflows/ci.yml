name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: prebuild-${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        shell: ${{ matrix.os == 'windows-latest' && 'pwsh' || 'bash' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node 22.23.3
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Check
        run: npm run check
      - name: Build blank shell
        run: npm run build
      - name: Generate prebuild evaluator evidence
        run: npm run eval:smoke
      - name: Upload prebuild infrastructure evidence
        uses: actions/upload-artifact@v4
        with:
          name: prebuild-infrastructure-evidence-${{ matrix.os }}
          path: evals/reports/*.json
          if-no-files-found: error
